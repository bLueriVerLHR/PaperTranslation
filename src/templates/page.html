<!DOCTYPE html>
<html lang="zh-Hans" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<meta name="description" content="{{SUBTITLE}}">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/styles/reader.css">
</head>
<body>
<a class="skip-link" href="#content">跳到正文</a>

<div class="toolbar" role="toolbar" aria-label="阅读工具栏">
  <button id="theme-toggle" type="button" aria-live="polite">跟随系统</button>
  <button id="top-button" type="button" hidden>顶部</button>
</div>

<main class="page" id="content" data-content-hash="{{CONTENT_HASH}}">
  <header class="title-block">
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <p class="meta"><span class="latin">{{AUTHOR}}</span> · {{READER_KIND}} · 更新于 {{BUILD_DATE}}</p>
    <p class="meta reading-notice">{{READER_NOTICE}}</p>
{{SOURCE_LINK}}
{{SOURCE_NOTES}}
  </header>

  <details class="toc" id="toc">
    <summary>目录</summary>
    <nav aria-label="目录">
{{TOC}}
    </nav>
  </details>

  <article class="body">
{{CONTENT}}
  </article>

</main>

<script src="{{ASSET_PREFIX}}assets/scripts/reader.js"></script>
</body>
</html>
