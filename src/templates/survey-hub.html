<!DOCTYPE html>
<html lang="zh-Hans" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<meta name="description" content="{{SUBTITLE}}">
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/styles/reader.css">
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/styles/survey.css">
</head>
<body>
<a class="skip-link" href="#content">跳到正文</a>

<div class="toolbar" role="toolbar" aria-label="阅读工具栏">
  <button id="theme-toggle" type="button" aria-live="polite">跟随系统</button>
  <button id="top-button" type="button" hidden>回到顶部</button>
</div>

<main class="page" id="content">
  <header class="title-block survey-masthead">
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <p class="meta">{{AUTHOR}} · 收录 {{PAPER_COUNT}} 篇论文 · 覆盖 {{DIRECTION_COUNT}} 个方向 · 生成于 {{BUILD_DATE}}</p>
  </header>

  <details class="toc" id="toc">
    <summary>目录</summary>
    <nav aria-label="目录">
{{TOC}}
    </nav>
  </details>

  <article class="body">
{{CONTENT}}
  </article>

  <footer class="colophon">
    <p>本页由本地构建流水线生成，内容哈希 <code>{{CONTENT_HASH}}</code>。</p>
    <p>论文标题、作者、方法名与引用数据保持原文；每篇论文的摘要译文见其详情页。</p>
  </footer>
</main>

<script src="{{ASSET_PREFIX}}assets/scripts/reader.js"></script>
</body>
</html>
