<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">描述符与 DMA：CPU 控制，设备搬移</title>
<desc id="desc">doorbell是工作通知，不承载完整有效载荷。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:monospace}</style>
<rect width="900" height="550" rx="12" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="bold">描述符与 DMA：CPU 控制，设备搬移</text>
<rect x="35" y="90" width="220" height="115" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="137.5" font-size="22">CPU / 应用</text>
<text x="49" y="169.5" font-size="22">填写工作参数</text>
