<text x="349" y="137.5" font-size="22">描述符／队列</text>
<text x="349" y="169.5" font-size="22">地址·长度·操作</text>
<rect x="635" y="90" width="220" height="115" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="649" y="137.5" font-size="22">NIC</text>
<text x="649" y="169.5" font-size="22">读取描述符</text>
<line x1="255" y1="146" x2="330" y2="146" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="555" y1="146" x2="630" y2="146" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="310" width="220" height="120" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="49" y="360.0" font-size="22">应用缓冲区</text>
<text x="49" y="392.0" font-size="22">有效载荷</text>
<rect x="335" y="310" width="220" height="120" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="349" y="360.0" font-size="22">DMA 引擎</text>
<text x="349" y="392.0" font-size="22">设备读／写</text>
<rect x="635" y="310" width="220" height="120" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="649" y="360.0" font-size="22">网络链路</text>
<text x="649" y="392.0" font-size="22">分包与传输</text>
<line x1="255" y1="370" x2="330" y2="370" stroke="#243244" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="555" y1="370" x2="630" y2="370" stroke="#243244" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="745" y1="205" x2="445" y2="305" stroke="#243244" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="35" y="491" font-size="22">完成记录另回队列；发布顺序与缓冲区生命周期必须正确。</text>
