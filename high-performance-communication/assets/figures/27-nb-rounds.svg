<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">NB：p = 5 的步长与发送份数</title>
<desc id="desc">只示意文档定义的轮数、步长和块数量。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:monospace}</style>
<rect width="900" height="500" rx="12" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="bold">NB：p = 5 的步长与发送份数</text>
<rect x="35" y="95" width="825" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="124.0" font-size="23">第 1 阶段：步长 1；发送 2 份</text>
<text x="49" y="157.0" font-size="23">每份 n/5 字节；目标 rank = (i + 1) mod 5</text>
<rect x="35" y="198" width="825" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="227.0" font-size="23">第 2 阶段：步长 2；发送 1 份</text>
<text x="49" y="260.0" font-size="23">每份 n/5 字节；目标 rank = (i + 2) mod 5</text>
<rect x="35" y="301" width="825" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="330.0" font-size="23">第 3 阶段：步长 4；发送 1 份</text>
<text x="49" y="363.0" font-size="23">每份 n/5 字节；目标 rank = (i + 4) mod 5</text>
<text x="35" y="432" font-size="24" font-weight="bold">总发送：2 + 1 + 1 = 4 份，即 4n/5 字节。</text>
<text x="35" y="472" font-size="22">不是完整缓冲区排列；贡献集合和接收偏移还需调度。</text>
</svg>
