<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">AHC：二卡组与三卡组的边界对应</title>
<desc id="desc">12片等长教学例，以区间定义逻辑同号卡。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:monospace}</style>
<rect width="900" height="590" rx="12" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="bold">AHC：二卡组与三卡组的边界对应</text>
<text x="30" y="126" font-size="23" font-weight="bold">二卡组</text>
<text x="30" y="263" font-size="23" font-weight="bold">三卡组</text>
<rect x="180" y="80" width="325" height="85" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="194" y="129.0" font-size="23">A0: [0,6)</text>
<rect x="510" y="80" width="325" height="85" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="524" y="129.0" font-size="23">A1: [6,12)</text>
<rect x="180" y="220" width="215" height="85" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="194" y="267.5" font-size="20">B0: [0,4)</text>
<rect x="400" y="220" width="215" height="85" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="414" y="267.5" font-size="20">B1: [4,8)</text>
<rect x="620" y="220" width="215" height="85" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="634" y="267.5" font-size="20">B2: [8,12)</text>
<line x1="290.0" y1="169" x2="290.0" y2="215" stroke="#243244" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="455.0" y1="169" x2="455.0" y2="215" stroke="#243244" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="565.0" y1="169" x2="565.0" y2="215" stroke="#243244" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="730.0" y1="169" x2="730.0" y2="215" stroke="#243244" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="35" y="345" width="825" height="134" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="385.5" font-size="23">公共边界：0、4、6、8、12</text>
<text x="49" y="418.5" font-size="23">四个区间各自跨组 AllReduce，再组内 AllGather</text>
<text x="49" y="451.5" font-size="23">对应相同结果区间，而非必须具有相同物理卡号</text>
<text x="35" y="544" font-size="21">箭头表示对应区间的跨组操作；每区间每组只有一个所有者。</text>
</svg>
