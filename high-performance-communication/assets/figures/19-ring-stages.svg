<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Ring AllReduce：两个阶段</title>
<desc id="desc">四rank逻辑环，分片归约再拼接。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:monospace}</style>
<rect width="900" height="660" rx="12" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="bold">Ring AllReduce：两个阶段</text>
<line x1="197" y1="165" x2="308" y2="165" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="335" y1="192" x2="335" y2="283" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="308" y1="310" x2="197" y2="310" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="170" y1="283" x2="170" y2="192" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="170" cy="165" r="27" fill="#fff" stroke="#2563a8" stroke-width="2"/>
<text x="164" y="172" font-size="20">0</text>
<circle cx="335" cy="165" r="27" fill="#fff" stroke="#2563a8" stroke-width="2"/>
<text x="329" y="172" font-size="20">1</text>
<circle cx="335" cy="310" r="27" fill="#fff" stroke="#2563a8" stroke-width="2"/>
<text x="329" y="317" font-size="20">2</text>
<circle cx="170" cy="310" r="27" fill="#fff" stroke="#2563a8" stroke-width="2"/>
<text x="164" y="317" font-size="20">3</text>
<rect x="450" y="115" width="415" height="125" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="464" y="167.5" font-size="22">阶段一：ReduceScatter</text>
<text x="464" y="199.5" font-size="22">3 轮；每轮传 n/4 并归约</text>
<rect x="450" y="280" width="415" height="125" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="464" y="332.5" font-size="22">阶段二：AllGather</text>
<text x="464" y="364.5" font-size="22">3 轮；复制完成片，不再归约</text>
<rect x="40" y="440" width="825" height="105" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="54" y="482.5" font-size="22">阶段一末：各 rank 负责一个全局结果片</text>
<text x="54" y="514.5" font-size="22">阶段二末：每个 rank 得到完整结果向量</text>
<text x="40" y="603" font-size="23">逻辑边不等于物理布线；中间片段所有者可置换。</text>
</svg>
