<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" role="img" aria-labelledby="title desc">
<title id="title">递归折半 → 倍增：p = 4</title>
<desc id="desc">每轮缩小责任区间，再反向拼接。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:monospace}</style>
<rect width="900" height="710" rx="12" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="bold">递归折半 → 倍增：p = 4</text>
<rect x="35" y="85" width="830" height="84" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="117.0" font-size="22">初始</text>
<text x="49" y="149.0" font-size="22">各 rank 持完整输入 n；贡献集合大小 1</text>
<line x1="450" y1="171" x2="450" y2="195" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="197" width="830" height="84" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="229.0" font-size="22">折半第一轮</text>
<text x="49" y="261.0" font-size="22">0↔2，1↔3；交换 n/2；保留半区</text>
<line x1="450" y1="283" x2="450" y2="307" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="309" width="830" height="84" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="49" y="341.0" font-size="22">折半第二轮</text>
<text x="49" y="373.0" font-size="22">0↔1，2↔3；交换 n/4；得到全局结果片</text>
<line x1="450" y1="395" x2="450" y2="419" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="421" width="830" height="84" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="49" y="453.0" font-size="22">倍增第一轮</text>
<text x="49" y="485.0" font-size="22">反向交换 n/4；拼成半向量</text>
<line x1="450" y1="507" x2="450" y2="531" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="35" y="533" width="830" height="84" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="49" y="565.0" font-size="22">倍增第二轮</text>
<text x="49" y="597.0" font-size="22">反向交换 n/2；恢复完整向量</text>
<text x="35" y="680" font-size="22">该伙伴顺序保留 rank 块顺序；其他顺序可能需要置换。</text>
</svg>
