<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">跨层 Pipeline：到达一块就开始分发</title>
<desc id="desc">理想独立资源的三块两级流水。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:monospace}</style>
<rect width="900" height="450" rx="12" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="bold">跨层 Pipeline：到达一块就开始分发</text>
<text x="40" y="105" font-size="23" font-weight="bold">跨机</text>
<text x="40" y="232" font-size="23" font-weight="bold">机内</text>
<rect x="145" y="73" width="160" height="80" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="159" y="119.0" font-size="22">传输块 1</text>
<rect x="320" y="200" width="160" height="80" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="334" y="246.0" font-size="22">分发块 1</text>
<line x1="225" y1="155" x2="375" y2="195" stroke="#243244" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="320" y="73" width="160" height="80" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="334" y="119.0" font-size="22">传输块 2</text>
<rect x="495" y="200" width="160" height="80" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="509" y="246.0" font-size="22">分发块 2</text>
<line x1="400" y1="155" x2="550" y2="195" stroke="#243244" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="495" y="73" width="160" height="80" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="509" y="119.0" font-size="22">传输块 3</text>
<rect x="670" y="200" width="160" height="80" rx="9" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="684" y="246.0" font-size="22">分发块 3</text>
<line x1="575" y1="155" x2="725" y2="195" stroke="#243244" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<line x1="150" y1="325" x2="850" y2="325" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="150" y="365" font-size="22">时间 →；虚线是数据就绪依赖，不是额外数据传输。</text>
<text x="40" y="414" font-size="22">填充和排空仍有成本；共享 DMA／内存资源会减少重叠。</text>
</svg>
