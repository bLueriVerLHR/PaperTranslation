<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">块程序与运行资源：数据依赖不等于指令</title>
<desc id="desc">MSCCL综述架构的原创层次说明。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:monospace}</style>
<rect width="900" height="660" rx="12" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="bold">块程序与运行资源：数据依赖不等于指令</text>
<rect x="40" y="78" width="820" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="54" y="107.0" font-size="22">块程序／communication sketch</text>
<text x="54" y="139.0" font-size="22">说明块从哪来到哪去</text>
<line x1="450" y1="158" x2="450" y2="181" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="184" width="820" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="54" y="213.0" font-size="22">chunk DAG</text>
<text x="54" y="245.0" font-size="22">记录数据依赖</text>
<line x1="450" y1="264" x2="450" y2="287" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="290" width="820" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="54" y="319.0" font-size="22">instruction DAG</text>
<text x="54" y="351.0" font-size="22">展开传输、归约和同步</text>
<line x1="450" y1="370" x2="450" y2="393" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="396" width="820" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="54" y="425.0" font-size="22">调度与中间表示</text>
<text x="54" y="457.0" font-size="22">channel / thread block / 指令顺序</text>
<line x1="450" y1="476" x2="450" y2="499" stroke="#243244" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="502" width="820" height="78" rx="9" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="54" y="531.0" font-size="22">运行时＋通信后端</text>
<text x="54" y="563.0" font-size="22">执行任务，使用设备与网络资源</text>
<text x="40" y="632" font-size="22">拆分增加并行，聚合减少启动；两者都有资源与同步成本。</text>
</svg>
