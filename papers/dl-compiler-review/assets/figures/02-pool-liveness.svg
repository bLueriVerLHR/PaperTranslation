<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">回放不更新记账与检查点恢复</title>
<desc id="desc">录制时分配器记账与图内存池一致并存下检查点；回放只发射内核，记账停在录制时刻；要在同一池上继续录制，先恢复检查点。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#243244"/></marker></defs>
<style>text{font-family:"Source Han Serif SC","Microsoft YaHei",serif;fill:#243244} .code{font-family:"Maple Mono CN",monospace} .muted{fill:#4a5b6e}</style>
<rect width="900" height="640" rx="12" fill="#fff"/>
<text x="30" y="44" font-size="27" font-weight="bold">回放不更新记账：检查点补上的那一环</text>

<rect x="30" y="86" width="270" height="290" rx="9" fill="#fff" stroke="#2563a8" stroke-width="2"/>
<text x="46" y="118" font-size="19" font-weight="bold">① 录制 G1</text>
<text x="46" y="146" font-size="15" class="muted">分配器记账</text>
<rect x="46" y="154" width="238" height="44" rx="6" fill="#f5f8fc" stroke="#2563a8" stroke-width="1.6"/>
<rect x="52" y="160" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="87" y="181" font-size="15" text-anchor="middle" class="code">输入</text>
<rect x="130" y="160" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="165" y="181" font-size="15" text-anchor="middle" class="code">中间值</text>
<rect x="208" y="160" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="243" y="181" font-size="15" text-anchor="middle" class="code">输出</text>
<text x="46" y="228" font-size="15" class="muted">图内存池</text>
<rect x="46" y="236" width="238" height="44" rx="6" fill="#f5f8fc" stroke="#2563a8" stroke-width="1.6"/>
<rect x="52" y="242" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="87" y="263" font-size="15" text-anchor="middle" class="code">输入</text>
<rect x="130" y="242" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="165" y="263" font-size="15" text-anchor="middle" class="code">中间值</text>
<rect x="208" y="242" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="243" y="263" font-size="15" text-anchor="middle" class="code">输出</text>
<text x="46" y="308" font-size="15">账与池一致。</text>
<text x="46" y="332" font-size="15" class="muted">录制结束时存下检查点</text>
<text x="46" y="356" font-size="15" class="muted">只存记账，不复制张量。</text>

<rect x="325" y="86" width="270" height="290" rx="9" fill="#fff" stroke="#a83a25" stroke-width="2"/>
<text x="341" y="118" font-size="19" font-weight="bold">② 回放 G1</text>
<text x="341" y="146" font-size="15" class="muted">分配器记账</text>
<rect x="341" y="154" width="238" height="44" rx="6" fill="#f4f6f9" stroke="#8a97a8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="460" y="181" font-size="15" text-anchor="middle" class="muted">没有更新</text>
<text x="341" y="228" font-size="15" class="muted">图内存池</text>
<rect x="341" y="236" width="238" height="44" rx="6" fill="#f5f8fc" stroke="#a83a25" stroke-width="1.6"/>
<rect x="347" y="242" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="382" y="263" font-size="15" text-anchor="middle" class="code">输入</text>
<rect x="425" y="242" width="70" height="32" rx="4" fill="#a83a25" opacity="0.26"/>
<text x="460" y="263" font-size="15" text-anchor="middle" class="code">中间值</text>
<rect x="503" y="242" width="70" height="32" rx="4" fill="#2563a8" opacity="0.22"/>
<text x="538" y="263" font-size="15" text-anchor="middle" class="code">输出</text>
<text x="341" y="308" font-size="15">只回放 GPU 操作。</text>
<text x="341" y="332" font-size="15" class="muted">CPU 记账未同步重建。</text>
<text x="341" y="356" font-size="15" class="muted">直接录新图可能覆盖存活值。</text>

<rect x="620" y="86" width="270" height="290" rx="9" fill="#fff" stroke="#237b65" stroke-width="2"/>
<text x="636" y="118" font-size="19" font-weight="bold">③ 恢复检查点后录 G2</text>
<text x="636" y="146" font-size="15" class="muted">分配器记账</text>
<rect x="636" y="154" width="238" height="44" rx="6" fill="#f5f8fc" stroke="#237b65" stroke-width="1.6"/>
<rect x="642" y="160" width="70" height="32" rx="4" fill="#237b65" opacity="0.2"/>
<text x="677" y="181" font-size="15" text-anchor="middle" class="code">输入</text>
<rect x="720" y="160" width="70" height="32" rx="4" fill="#237b65" opacity="0.2"/>
<text x="755" y="181" font-size="15" text-anchor="middle" class="code">中间值</text>
<rect x="798" y="160" width="70" height="32" rx="4" fill="#237b65" opacity="0.2"/>
<text x="833" y="181" font-size="15" text-anchor="middle" class="code">输出</text>
<text x="636" y="228" font-size="15" class="muted">图内存池</text>
<rect x="636" y="236" width="238" height="44" rx="6" fill="#f5f8fc" stroke="#237b65" stroke-width="1.6"/>
<rect x="642" y="242" width="70" height="32" rx="4" fill="#237b65" opacity="0.2"/>
<text x="677" y="263" font-size="15" text-anchor="middle" class="code">输入</text>
<rect x="720" y="242" width="70" height="32" rx="4" fill="#237b65" opacity="0.2"/>
<text x="755" y="263" font-size="15" text-anchor="middle" class="code">中间值</text>
<rect x="798" y="242" width="70" height="32" rx="4" fill="#237b65" opacity="0.2"/>
<text x="833" y="263" font-size="15" text-anchor="middle" class="code">输出</text>
<text x="636" y="308" font-size="15">写回 G1 结束时刻的状态。</text>
<text x="636" y="332" font-size="14" class="muted">恢复并协调仍存活的张量。</text>
<text x="636" y="356" font-size="15" class="muted">之后才可安全分配与录制。</text>

<line x1="30" y1="404" x2="870" y2="404" stroke="#d5dde8" stroke-width="1.5"/>

<circle cx="120" cy="444" r="17" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="120" y="451" font-size="17" text-anchor="middle" class="code">1</text>
<circle cx="60" cy="520" r="17" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="60" y="527" font-size="17" text-anchor="middle" class="code">2</text>
<circle cx="180" cy="520" r="17" fill="#f5f8fc" stroke="#2563a8" stroke-width="2"/>
<text x="180" y="527" font-size="17" text-anchor="middle" class="code">3</text>
<circle cx="60" cy="596" r="17" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="60" y="603" font-size="17" text-anchor="middle" class="code">4</text>
<circle cx="180" cy="596" r="17" fill="#f5f8fc" stroke="#237b65" stroke-width="2"/>
<text x="180" y="603" font-size="17" text-anchor="middle" class="code">4′</text>
<line x1="112" y1="456" x2="68" y2="510" stroke="#243244" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="130" y1="454" x2="172" y2="510" stroke="#243244" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="60" y1="537" x2="60" y2="577" stroke="#243244" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="537" x2="180" y2="577" stroke="#243244" stroke-width="2" marker-end="url(#arrow)"/>

<text x="300" y="452" font-size="18">1 → 2 → 4 与 1 → 3 → 4 各需一份录制：</text>
<text x="300" y="480" font-size="18" class="muted">结点 4 的输入地址在两份里不同，</text>
<text x="300" y="508" font-size="18" class="muted">所以同一段代码按路径分裂成多份。</text>
<text x="300" y="556" font-size="18">共享一块池的前提是：</text>
<text x="300" y="584" font-size="18" class="muted">各路径满足地址与存活约束；</text>
<text x="300" y="612" font-size="18" class="muted">切换到录制前恢复相应池状态。</text>
</svg>
